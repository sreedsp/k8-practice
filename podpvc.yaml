apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
    - name: my-container
      image: busybox
      command: ["sh", "-c", "echo Hello Kubernetes! && sleep 3600"]
      volumeMounts:
        - mountPath: "/data"
          name: my-volume
          readOnly: false 
  volumes:
    - name: my-volume
      persistentVolumeClaim:
        claimName: my-pvc